esphome:
  name: ohmleader
  friendly_name: Ohmleader

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: ""

ota:
  - platform: esphome
    password: ""

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password
#  manual_ip:
#    static_ip: 192.168.1.22
#    gateway: 192.168.1.1
#    subnet: 255.255.255.0
#    dns1: 8.8.8.8
#    dns2: 8.8.4.4

ethernet:
  type: W5500
  clk_pin: GPIO42
  mosi_pin: GPIO43
  miso_pin: GPIO44
  cs_pin: GPIO41
  interrupt_pin: GPIO2
  reset_pin: GPIO1
  manual_ip:
    static_ip: 192.168.1.22
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 8.8.4.4

web_server:
  port: 80

# Sun — szükséges a napkelte / napnyugta ellenőrzéshez
sun:
  latitude: 46.32235
  longitude: 20.49440
  id: sun_main

time:
  - platform: sntp
    servers:
      - 0.hu.pool.ntp.org
      - 1.hu.pool.ntp.org
    id: sntp_time
    on_time:
      - seconds: /30
        then:
          - lambda: |-
              bool value_ev = id(futas_engedelyezett_ev).state;
              id(futas_engedelyezett_ev).publish_state(value_ev);
              bool value_nyar = id(futas_engedelyezett_nyar).state;
              id(futas_engedelyezett_nyar).publish_state(value_nyar);

uart:
  - id: mod_bus
    baud_rate: 4800
    parity: NONE 
    stop_bits: 1
    debug:
      direction: BOTH
      dummy_receiver: true
      after:
        timeout: 10ms
    tx_pin: 7
    rx_pin: 15

modbus:  
  id: modbus1

modbus_controller:  
  - id: omero
    address: 0x0003
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 1500ms
    command_throttle: 500ms

# PID működéséhez szükséges globális változók definiálása
globals:

  - id: pid_error_3f
    type: float
    initial_value: '0.0'
  - id: pid_integral_3f
    type: float
    initial_value: '0.0'
  - id: pid_derivative_3f
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: pid_prev_error_3f
    type: float
    initial_value: '0.0'

  # Auto-tune változók
  - id: autotune_active
    type: bool
    initial_value: 'false'
  - id: autotune_step
    type: int
    initial_value: '0'
  - id: autotune_pwm_step
    type: float
    initial_value: '0.0'
  - id: autotune_response_time
    type: float
    initial_value: '0.0'
  - id: autotune_last_power
    type: float
    initial_value: '0.0'
  - id: autotune_start_time
    type: int
    initial_value: '0'
  - id: autotune_max_overshoot
    type: float
    initial_value: '0.0'
  - id: autotune_wait_end
    type: int
    initial_value: '0'  # Várakozás vége időbélyeg
  - id: autotune_cycle_count
    type: int
    initial_value: '0'
  - id: autotune_ku_sum
    type: float
    initial_value: '0.0'
  - id: autotune_tu_sum
    type: float
    initial_value: '0.0'

  # Fűtőszál teljesítménye:
  - id: futoszal_teljesitmeny_3f
    type: float
    initial_value: '3200'  # Állítsd be a valódi értéket! [W]

 # Globális változók mk2 vezérléséhez
  - id: pwm_l1
    type: float
    initial_value: '0.0'

  - id: pwm_l2
    type: float
    initial_value: '0.0'

  - id: pwm_l3
    type: float
    initial_value: '0.0'

datetime:
  - platform: template
    id: futes_kezdete
    name: "Fűtési időszak kezdete"
    type: date
    initial_value: "2025-10-15"
    optimistic: true

  - platform: template
    id: futes_vege
    name: "Fűtési időszak vége"
    type: date
    initial_value: "2025-03-15"
    optimistic: true

  - platform: template
    id: futes_ido_kezd
    name: "Fűtési idő kezdete"
    type: time
    initial_value: "13:00:00"
    optimistic: true

button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "PID Auto-tune indítása"
    id: start_autotune
    on_press:
      - lambda: |-
          id(autotune_active) = true;
          id(autotune_step) = 0;
          id(autotune_pwm_step) = 0.2;  // 20% lépcső
          id(pwm_l1) = 0.0;
          id(pwm_l2) = 0.0;
          id(pwm_l3) = 0.0;
          id(autotune_response_time) = 0;
          id(autotune_max_overshoot) = 0;
          ESP_LOGI("AUTOTUNE", "Auto-tune indítva - teljesítmény szabályozáshoz");

number:
  - platform: template
    id: autotune_enabled
    name: "Auto-tune engedélyezése"
    max_value: 1.0
    min_value: 0.0
    step: 1.0
    optimistic: true
    initial_value: 0.0

  - platform: template
    id: celt
    name: "Célhőmérséklet"
    unit_of_measurement: "°C"
    device_class: temperature
    max_value: 65.0
    min_value: 30.0
    step: 0.5
    optimistic: true
    initial_value: 55.0
    mode: BOX

  - platform: template
    id: maxt
    name: "Maximális hőmérséklet"
    unit_of_measurement: "°C"
    device_class: temperature
    max_value: 75.0
    min_value: 30.0
    step: 0.5
    optimistic: true
    initial_value: 65.0
    mode: BOX

  - platform: template
    id: kcel
    name: "Alapjel"
    unit_of_measurement: "%"
    max_value: 100.0
    min_value: 0.0
    step: 1
    optimistic: true
    initial_value: 0.0

  - platform: template
    id: ehtr
    name: "Energiahatár"
    unit_of_measurement: "kWh"
    device_class: energy
    max_value: 100.0
    min_value: -100.0
    step: 5
    optimistic: true
    initial_value: 50
    mode: BOX

  - platform: template
    id: kpp
    name: "Kp"
    max_value: 4.0  # Megnövelt max érték
    min_value: 0.0
    step: 0.01
    optimistic: true
    initial_value: 2.5  # Megnövelt kezdeti érték
    mode: BOX

  - platform: template
    id: kii
    name: "Ki"
    max_value: 2.0  # Megnövelt max érték
    min_value: 0.0
    step: 0.001
    optimistic: true
    initial_value: 0.6  # Megnövelt kezdeti érték
    mode: BOX
    restore_value: True

  - platform: template
    id: kdd
    name: "Kd"
    max_value: 2.0  # Megnövelt max érték
    min_value: 0.0
    step: 0.01
    optimistic: true
    initial_value: 0.6  # Megnövelt kezdeti érték
    mode: BOX
    restore_value: True

select:
- platform: template
  id: mukodes
  name: "Működés"
  options:
    - "Auto"
    - "Kézi"
  initial_option: "Auto"
  optimistic: True
  set_action:
      then:
        - script.execute: power

sensor:
#  - platform: wifi_signal
#    name: "WiFi Signal Sensor"
#    update_interval: 60s

  - platform: modbus_controller
    modbus_controller_id: omero
    id: opt
    name: "Pillanatnyi teljesítmény"
    address: 0x5012
    state_class: measurement
    device_class: power
    unit_of_measurement: "kW" 
    register_type: holding
    value_type: FP32
    accuracy_decimals: 2

  - platform: total_daily_energy
    name: 'Napi fogyasztás'
    power_id: opt
    unit_of_measurement: 'kWh'
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3

  - platform: modbus_controller
    modbus_controller_id: omero
    id: opt_l1
    name: "Pillanatnyi teljesítmény L1"
    address: 0x5014
    state_class: measurement
    device_class: power
    unit_of_measurement: "kW" 
    register_type: holding
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: omero
    id: opt_l2
    name: "Pillanatnyi teljesítmény L2"
    address: 0x5016
    state_class: measurement
    device_class: power
    unit_of_measurement: "kW" 
    register_type: holding
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: omero
    id: opt_l3
    name: "Pillanatnyi teljesítmény L3"
    address: 0x5018
    state_class: measurement
    device_class: power
    unit_of_measurement: "kW" 
    register_type: holding
    value_type: FP32
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: omero
    id: ove
    name: "Hatásos villamos energia"
    address: 0x600C
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: "kWh" 
    register_type: holding
    value_type: FP32
    accuracy_decimals: 2
    internal: True

  - platform: template
    id: ovf
    name: "Villamos fogyasztás"
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: "kWh"
    lambda: |-
      return id(ove).state - 284.76; // A fogyasztásmérő korábbi fogyasztása, ha nem 0-ról indult a mérés.
  
  - platform: homeassistant
    entity_id: sensor.p1_meter_5c2faf10f87a_aktiv_teljesitmeny_1_fazis
    id: fmw1
    name: "Fogyasztásmérő L1"
    device_class: power
    unit_of_measurement: "W"

  - platform: homeassistant
    entity_id: sensor.p1_meter_5c2faf10f87a_aktiv_teljesitmeny_2_fazis
    id: fmw2
    name: "Fogyasztásmérő L2"
    device_class: power
    unit_of_measurement: "W"

  - platform: homeassistant
    entity_id: sensor.p1_meter_5c2faf10f87a_aktiv_teljesitmeny_3_fazis
    id: fmw3
    name: "Fogyasztásmérő L3"
    device_class: power
    unit_of_measurement: "W"
    
  - platform: homeassistant
    entity_id: sensor.p1_aktiv_teljesitmeny
    id: fmw
    name: "Fogyasztásmérő"
    device_class: power
    unit_of_measurement: "W"
    
  - platform: homeassistant
    entity_id: sensor.bsb_lan_hmv_homerseklet_b3
    id: hmvh
    name: "HMV tartály hőmérséklet"
    device_class: temperature
    unit_of_measurement: "°C"

  - platform: homeassistant
    entity_id: sensor.fennmarado_villamos_energia
    id: fve
    name: "Fennmaradó villamos energia"
    device_class: energy
    unit_of_measurement: "kWh"

binary_sensor:
  - platform: status
    id: st
    name: "ESP Kapcsolatban van"

  - platform: gpio
    name: "MK1"
    id: mk1_input
    pin:
      number: 16
      inverted: true
    on_state: 
      - then:
        - script.execute: power

  - platform: gpio
    name: "Engedélyező kapcsoló"
    id: en_switch
    pin:
      number: 17
      inverted: true
    on_state: 
      - then:
        - script.execute: power
  
  - platform: template
    name: "Auto-tune aktív"
    id: autotune_active_sensor
    lambda: |-
      return id(autotune_active);

  # Engedélyezés ősz-tavasz: 09.15 -> 12.31 és 01.01 -> 05.15, napközben, fennmaradó villamos energia > 50kWh
  - platform: template
    name: "Fűtés engedélyezett (őszi–tavaszi)"
    id: futas_engedelyezett_ev
    lambda: |-
      // Fennmaradó energia
      float energy = id(fve).state;
      if (energy <= id(ehtr).state) return false;

      // Aktuális dátum
      auto now = id(sntp_time).now();
      if (!now.is_valid()) return false;
      int m = now.month;
      int d = now.day_of_month;

      // Beállított kezdő dátum (téli időszak kezdete)
      int sm = id(futes_kezdete).month;
      int sd = id(futes_kezdete).day;

      // Beállított záró dátum (téli időszak vége)
      int em = id(futes_vege).month;
      int ed = id(futes_vege).day;

      bool in_range = false;

      // Ellenőrizzük, hogy átnyúlik-e évfordulón (pl. 09.15 → 05.15)
      bool crosses_year = (sm > em) || (sm == em && sd > ed);

      if (crosses_year) {
        // Példa: 09.15 → 12.31 ÉS 01.01 → 05.15
        if ((m > sm || (m == sm && d >= sd)) ||
            (m < em || (m == em && d <= ed))) {
          in_range = true;
        }
      } else {
        // Nem lépi át az év végét
        if ((m > sm || (m == sm && d >= sd)) &&
            (m < em || (m == em && d <= ed))) {
          in_range = true;
        }
      }

      if (!in_range) return false;

      // Kezdő időpont (óra:perc)
      int sh = id(futes_ido_kezd).hour;
      int smi = id(futes_ido_kezd).minute;

      if (now.hour < sh || (now.hour == sh && now.minute < smi))
        return false;

      // Napközben legyen
      if (!id(sun_main).is_above_horizon()) return false;

      return true;

  # Engedélyezés nyár: 05.15 -> 09.15 között, csak ha a fennmaradó villamos energia > 50kWh
  - platform: template
    name: "Fűtés engedélyezett (nyári)"
    id: futas_engedelyezett_nyar
    lambda: |-
      // Fennmaradó energia
      float energy = id(fve).state;
      if (energy <= id(ehtr).state) return false;

      // Aktuális dátum
      auto now = id(sntp_time).now();
      if (!now.is_valid()) return false;
      int m = now.month;
      int d = now.day_of_month;

      // Nyár kezdete = téli időszak vége (pl. 05.15)
      int sm = id(futes_vege).month;
      int sd = id(futes_vege).day;

      // Nyár vége = téli időszak kezdete (pl. 09.15)
      int em = id(futes_kezdete).month;
      int ed = id(futes_kezdete).day;

      // Dátum tartomány ellenőrzése
      bool in_range = false;
      if ((m > sm || (m == sm && d >= sd)) &&
          (m < em || (m == em && d <= ed))) {
        in_range = true;
      }

      return in_range;

script:
  - id: power
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("custom", "power script fut");

          bool ev = id(futas_engedelyezett_ev).state;
          bool nyar = id(futas_engedelyezett_nyar).state;
          bool mk1 = id(mk1_input).state;
          bool en = id(en_switch).state;

          const char* mode = id(mukodes).current_option().c_str();

          bool felt = (id(hmvh).state < id(celt).state &&
                       id(maxt).state > id(hmvh).state &&
                       mk1 && 
                       en);

          if (!felt) {
            id(pwm_output1).set_level(0);
            id(pwm_output2).set_level(0);
            id(pwm_output3).set_level(0);
            id(pwm_l1) = 0.0;
            id(pwm_l2) = 0.0;
            id(pwm_l3) = 0.0;
            id(pid_integral_3f) = 0;
            ESP_LOGD("custom", "Nincs fűtési feltétel – minden PWM=0");
            return;
          }

          // TÉLI ÜZEM (100% fűtés)
          if (ev && strcmp(mode, "Auto") == 0) {
            id(pwm_output1).set_level(0.98);
            id(pwm_output2).set_level(0.98);
            id(pwm_output3).set_level(0.98);
            id(pwm_l1) = 0.98;
            id(pwm_l2) = 0.98;
            id(pwm_l3) = 0.98;
            ESP_LOGI("custom", "Téli 3F override – 98%% PWM minden fázison");
            return;
          }

          // PID SZABÁLYOZÁS (Auto módban - nyár)
          if (nyar && strcmp(mode, "Auto") == 0) {
            
            // Várakozási fázis ellenőrzése (auto-tune)
            if (id(autotune_wait_end) > 0) {
              if (millis() < id(autotune_wait_end)) {
                return;
              } else {
                id(autotune_wait_end) = 0;
                id(autotune_active) = false;
                id(autotune_step) = 0;
                id(pwm_output1).set_level(0);
                id(pwm_output2).set_level(0);
                id(pwm_output3).set_level(0);
                id(pwm_l1) = 0;
                id(pwm_l2) = 0;
                id(pwm_l3) = 0;
                ESP_LOGI("AUTOTUNE", "Auto-tune befejezve");
                return;
              }
            }
            
            // AUTO-TUNE FÁZIS
            if (id(autotune_active) && id(autotune_enabled).state > 0.5) {
              switch(id(autotune_step)) {
                case 0: {
                  id(autotune_last_power) = id(fmw).state;
                  id(autotune_start_time) = millis();
                  id(autotune_step) = 1;
                  ESP_LOGI("AUTOTUNE", "Alap teljesítmény: %.1fW", id(autotune_last_power));
                  break;
                }
                case 1: {
                  id(pwm_l1) = id(autotune_pwm_step);
                  id(pwm_l2) = id(autotune_pwm_step);
                  id(pwm_l3) = id(autotune_pwm_step);
                  id(pwm_output1).set_level(id(autotune_pwm_step));
                  id(pwm_output2).set_level(id(autotune_pwm_step));
                  id(pwm_output3).set_level(id(autotune_pwm_step));
                  id(autotune_start_time) = millis();
                  id(autotune_step) = 2;
                  ESP_LOGI("AUTOTUNE", "PWM lépcső: %.0f%%", id(autotune_pwm_step)*100);
                  break;
                }
                case 2: {
                  float current_power = id(fmw).state;
                  float power_change = current_power - id(autotune_last_power);
                  float target_change = id(autotune_pwm_step) * id(futoszal_teljesitmeny_3f) * 0.63;
                  uint32_t elapsed = millis() - id(autotune_start_time);
                  
                  if (fabs(power_change) >= fabs(target_change) || elapsed > 30000) {
                    float Tu = elapsed / 1000.0;
                    float Ku = (id(futoszal_teljesitmeny_3f) * id(autotune_pwm_step)) / (fabs(power_change) * 0.5);
                    
                    // Gyűjtsük az értékeket
                    id(autotune_ku_sum) += Ku;
                    id(autotune_tu_sum) += Tu;
                    id(autotune_cycle_count)++;
                    
                    ESP_LOGI("AUTOTUNE", "Ciklus %d: Tu=%.1fs, Ku=%.2f", id(autotune_cycle_count), Tu, Ku);
                    
                    if (id(autotune_cycle_count) >= 3) {
                      // Átlag számítás
                      float Ku_avg = id(autotune_ku_sum) / 3.0;
                      float Tu_avg = id(autotune_tu_sum) / 3.0;
                      
                      float kp_new = 0.6 * Ku_avg;
                      float ki_new = 1.2 * Ku_avg / Tu_avg;
                      float kd_new = 0.075 * Ku_avg * Tu_avg;
                      
                      // ... paraméterek beállítása ...
                      
                      ESP_LOGI("AUTOTUNE", "AUTOTUNE BEFEJEZVE! Átlag: Tu=%.1fs, Ku=%.2f", Tu_avg, Ku_avg);
                      
                      // Visszaállítás
                      id(autotune_active) = false;
                      id(autotune_step) = 0;
                      id(autotune_cycle_count) = 0;
                      id(autotune_ku_sum) = 0;
                      id(autotune_tu_sum) = 0;
                      id(autotune_wait_end) = 0;
                      
                      id(pwm_output1).set_level(0);
                      id(pwm_output2).set_level(0);
                      id(pwm_output3).set_level(0);
                    } else {
                      // Következő ciklus - kapcsoljuk ki a PWM-et, várjunk, majd újra
                      id(pwm_output1).set_level(0);
                      id(pwm_output2).set_level(0);
                      id(pwm_output3).set_level(0);
                      id(pwm_l1) = 0;
                      id(pwm_l2) = 0;
                      id(pwm_l3) = 0;
                      
                      id(autotune_wait_end) = millis() + 5000;  // 5 sec várakozás
                      id(autotune_step) = 0;  // Újrakezdés a következő ciklushoz
                    }
                  }
                  break;
                }
                case 3:
                  break;
              }
              return;
            }
            
            // NORMÁL PID MŰKÖDÉS
            float setpoint = -100.0;
            float measurement = id(fmw).state;
            float error = setpoint - measurement;
            
            float kp = id(kpp).state;
            float ki = id(kii).state;
            float kd = id(kdd).state;
            float dt = 1.0;
            float max_power = id(futoszal_teljesitmeny_3f);

            // ==============================================
            // EGYSZERŰ AUTO-P (csak 2 szabály)
            // ==============================================
            static float last_error = 0;

            // Ha a hiba nagy és nem csökken -> növeld Kp-t
            if (fabs(error) > 200 && fabs(error) >= fabs(last_error) * 0.95) {
                float new_kp = fmin(kp * 1.05, 4.0);  // Max 4.0
                if (new_kp != kp) {
                    id(kpp).publish_state(new_kp);
                    ESP_LOGI("AUTO_P", "Kp: %.2f -> %.2f (nagy hiba)", kp, new_kp);
                }
            }
            // Ha túllő -> csökkentsd Kp-t
            else if (last_error * error < 0 && fabs(error) > 50) {
                float new_kp = fmax(kp * 0.9, 0.1);  // Min 0.1
                if (new_kp != kp) {
                    id(kpp).publish_state(new_kp);
                    ESP_LOGI("AUTO_P", "Kp: %.2f -> %.2f (túllövés)", kp, new_kp);
                }
            }

            last_error = error;

            
            float raw_derivative = (error - id(pid_prev_error_3f)) / dt;
            float alpha = 0.15;
            id(pid_derivative_3f) = alpha * raw_derivative + (1 - alpha) * id(pid_derivative_3f);
            
            float integral_candidate = id(pid_integral_3f) + error * dt;
            float p_term = kp * error;
            float d_term = kd * id(pid_derivative_3f);
            float pre_output = p_term + d_term;
            
            if (pre_output > -max_power && pre_output < max_power) {
              id(pid_integral_3f) = integral_candidate;
            }
            
            id(pid_integral_3f) = fmax(fmin(id(pid_integral_3f), max_power), -max_power);
            float i_term = ki * id(pid_integral_3f);
            
            float output = p_term + i_term + d_term;
            output = fmax(fmin(output, max_power), -max_power);
            
            float target_pwm = output / max_power;
            target_pwm = fmax(fmin(target_pwm, 1.0), 0.0);
            
            float ramp_speed = 0.02;
            float current_pwm = id(pwm_l1);
            
            if (target_pwm > current_pwm)
              current_pwm = fmin(current_pwm + ramp_speed, target_pwm);
            else
              current_pwm = fmax(current_pwm - ramp_speed, target_pwm);
            
            id(pwm_output1).set_level(current_pwm);
            id(pwm_output2).set_level(current_pwm);
            id(pwm_output3).set_level(current_pwm);
            id(pwm_l1) = current_pwm;
            id(pwm_l2) = current_pwm;
            id(pwm_l3) = current_pwm;
            
            id(pid_prev_error_3f) = error;
            
            ESP_LOGI("PID", "Telj: %.1fW | Hiba: %.1fW | PWM: %.1f%% | Kp:%.3f Ki:%.3f Kd:%.3f", 
                    measurement, error, current_pwm*100, kp, ki, kd);
            ESP_LOGI("PID_DETAIL", "P:%.1f I:%.1f D:%.1f Sum:%.1f", 
                    p_term, i_term, d_term, output);
            
            return;
          }

          // KÉZI MÓD
          if (strcmp(mode, "Auto") != 0) {
            float pwm = id(kcel).state / 100.0;
            id(pwm_output1).set_level(pwm);
            id(pwm_output2).set_level(pwm);
            id(pwm_output3).set_level(pwm);
            id(pwm_l1) = pwm;
            id(pwm_l2) = pwm;
            id(pwm_l3) = pwm;
            ESP_LOGI("custom", "Kézi 3F pwm=%.2f", pwm);
            return;
          }

          // Biztonsági fallback
          id(pwm_output1).set_level(0.0);
          id(pwm_output2).set_level(0.0);
          id(pwm_output3).set_level(0.0);
          id(pwm_l1) = 0.0;
          id(pwm_l2) = 0.0;
          id(pwm_l3) = 0.0;
          ESP_LOGW("custom", "Nem felelt meg egyik feltétel sem – PWM=0");

interval:
  - interval: 1s
    then:
      - script.execute: power

  - id: mk1
    interval: 5s
    then: 
      - lambda: |-
          if ((id(maxt).state > id(hmvh).state) &&
              (id(st).state == 1 ) &&
              (id(en_switch).state == 1 )) {

            id(rele1).turn_on();

          } else {
            id(rele1).turn_off();
          }

  - id: mk2
    interval: 1s
    then:
      - lambda: |-
          if (id(pwm_l1) > 0.0 || id(pwm_l2) > 0.0 || id(pwm_l3) > 0.0) {
            id(rele2).turn_on();
            ESP_LOGW("custom", "MK2 BE");
          } else {
            id(rele2).turn_off();
          }
          
output:
  - platform: ledc
    id: pwm_output1
    pin: GPIO5
    inverted: True
    frequency: "50Hz"
    max_power: 1

  - platform: ledc
    id: pwm_output2
    pin: GPIO38
    inverted: True
    frequency: "50Hz"
    max_power: 1

  - platform: ledc
    id: pwm_output3
    pin: GPIO6
    inverted: True
    frequency: "50Hz"
    max_power: 1
  
  - platform: gpio
    id: rele1
    pin: GPIO40

  - platform: gpio
    id: rele2
    pin: GPIO39
